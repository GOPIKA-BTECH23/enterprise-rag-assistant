# Render Blueprint: deploys the FastAPI backend as a free Docker web service.
# Render > New > Blueprint > pick this repo. You'll be asked for the sync:false values.
services:
  - type: web
    name: enterprise-rag-assistant-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
